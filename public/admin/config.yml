backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# i18n config — spec Section 6.2
i18n:
  structure: multiple_files
  locales: [en, fr, it]
  default_locale: en

collections:
  - name: "insights"
    label: "Insights & News"
    folder: "src/content/insights"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { name: "locale", label: "Locale", widget: "hidden", default: "en", i18n: true }
      - { name: "title", label: "Title", widget: "string", i18n: true }
      - { name: "category", label: "Category", widget: "select", i18n: duplicate, options: ["News", "Events", "Insights"] }
      - { name: "publishDate", label: "Publish Date", widget: "datetime", i18n: duplicate }
      - { name: "coverImage", label: "Cover Image", widget: "image", i18n: duplicate, required: false }
      - { name: "excerpt", label: "Excerpt", widget: "text", i18n: true }
      - name: "tags"
        label: "Team Members"
        widget: "select"
        i18n: duplicate
        multiple: true
        required: false
        options:
          - { label: "Gian Marco Gilardi", value: "gian-marco-gilardi" }
          - { label: "Francesco Prazzo", value: "francesco-prazzo" }
          - { label: "Nathan Cordero di Montezemolo", value: "nathan-cordero-di-montezemolo" }
          - { label: "Gianmatteo Terruzzi", value: "gianmatteo-terruzzi" }
          - { label: "Martina Bestagno", value: "martina-bestagno" }
          - { label: "Avv. Cosimo Andrea Vestuti", value: "cosimo-andrea-vestuti" }
          - { label: "Avv. Alessandro Belluzzo", value: "alessandro-belluzzo" }
          - { label: "Avv. Paolo Zanazza", value: "paolo-zanazza" }
          - { label: "Arvine Zamani", value: "arvine-zamani" }
      - { name: "body", label: "Body", widget: "markdown", i18n: true }
