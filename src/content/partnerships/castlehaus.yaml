name: CastleHaus
url: https://castlehaus.co.uk
logo: /images/network/logo-red-full-.png
order: 1
desc:
  en: >-
    CastleHaus is an affiliated company of MCSC Group and a multidisciplinary
    platform for discovering talent, shaping ideas and creating opportunities
    across art, fashion and visual culture.


    Bringing together creative perspectives and emerging talent, CastleHaus fosters new ideas, meaningful connections and opportunities at the intersection of creativity, culture and business.
  fr: >-
    CastleHaus est une société affiliée à MCSC Group et une plateforme
    pluridisciplinaire dédiée à la découverte de talents, au développement
    d’idées et à la création d’opportunités dans les domaines de l’art, de la
    mode et de la culture visuelle.


    En réunissant des perspectives créatives et des talents émergents, CastleHaus favorise l’émergence de nouvelles idées, de connexions porteuses de sens et d’opportunités à la croisée de la créativité, de la culture et du monde des affaires.
  it: >-
    CastleHaus è una società affiliata a MCSC Group e una piattaforma
    multidisciplinare dedicata alla scoperta di talenti, allo sviluppo di idee e
    alla creazione di opportunità nei settori dell’arte, della moda e della
    cultura visiva.


    Attraverso l’incontro tra prospettive creative e talenti emergenti, CastleHaus promuove nuove idee, connessioni significative e opportunità all’incrocio tra creatività, cultura e business.
