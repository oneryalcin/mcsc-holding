name: Her Hoops Agency
url: https://www.herhoopsagency.com
logo: /images/network/hha_logo_black.png
order: 10
desc:
  en: Her Hoops Agency (HHA) is an agency created and led by women from the
    basketball world, specializing in supporting and representing female players
    throughout every stage of their careers, both on and off the court. They
    offer a 360º structure that combines representation, professional and
    personal development, brand building, education, and connections with
    sponsors, brands, and organisations. Their goal is to professionalize and
    transform the women’s basketball landscape by creating real opportunities
    and building sustainable careers. They work with a human, personalized, and
    multidisciplinary approach, connecting female talent with companies and
    projects that share our vision.
  fr: >-
    Her Hoops Agency (HHA) est une agence créée et dirigée par des femmes issues
    du monde du basketball, spécialisée dans l’accompagnement et la
    représentation des joueuses tout au long de leur carrière, sur et en dehors
    des terrains.

    L’agence propose une structure à 360° qui combine représentation sportive, développement professionnel et personnel, construction de marque, formation et mise en relation avec des sponsors, des marques et des organisations.

    Son objectif est de professionnaliser et de faire évoluer le paysage du basketball féminin en créant de véritables opportunités et en construisant des carrières durables. HHA adopte une approche humaine, personnalisée et multidisciplinaire, en mettant en relation les talents féminins avec des entreprises et des projets qui partagent sa vision.
  it: >-
    Her Hoops Agency (HHA) è un’agenzia fondata e guidata da donne provenienti
    dal mondo della pallacanestro, specializzata nel supporto e nella
    rappresentanza delle giocatrici durante ogni fase della loro carriera,
    dentro e fuori dal campo.

    L’agenzia offre una struttura a 360° che combina rappresentanza sportiva, sviluppo professionale e personale, costruzione del brand, formazione e connessioni con sponsor, brand e organizzazioni.

    Il suo obiettivo è professionalizzare e trasformare il panorama della pallacanestro femminile, creando opportunità concrete e costruendo carriere sostenibili. HHA adotta un approccio umano, personalizzato e multidisciplinare, mettendo in connessione i talenti femminili con aziende e progetti che condividono la sua visione.
