name: HIGH PROFILE
url: https://highprofile.aero/
logo: /images/network/high-profile.png
order: 6
desc:
  en: |-
    Founded in 2009, HIGH PROFILE is a VIP air charter broker. From their offices located in Paris, Nice, and Dubai, they provide their clients with a selection of over 25 000 jets worldwide.

    HIGH PROFILE is the one and only broker which benefits from an operational support of its sister company G-OPS, the French leader of ground service support dedicated to business aviation.

    This synergy allows a step-by-step follow-up of the flight operations and bespoke customer service, making HIGH PROFILE an A-Player in the industry.
  fr: |-
    Fondée en 2009, HIGH PROFILE est un courtier en affrètement aérien VIP. Depuis ses bureaux situés à Paris, Nice et Dubaï, l’entreprise propose à ses clients une sélection de plus de 25 000 jets dans le monde.

    HIGH PROFILE est le seul courtier bénéficiant du soutien opérationnel de sa société sœur G-OPS, leader français des services d’assistance au sol dédiés à l’aviation d’affaires.

    Cette synergie permet un suivi étape par étape des opérations de vol et un service client sur mesure, faisant de HIGH PROFILE un acteur majeur du secteur.
  it: |-
    Fondata nel 2009, HIGH PROFILE è un broker di charter aereo VIP. Dai suoi uffici situati a Parigi, Nizza e Dubai, offre ai propri clienti una selezione di oltre 25.000 jet in tutto il mondo.

    HIGH PROFILE è l’unico broker a beneficiare del supporto operativo della società sorella G-OPS, leader francese dei servizi di assistenza a terra dedicati all’aviazione business.

    Questa sinergia consente un monitoraggio passo dopo passo delle operazioni di volo e un servizio clienti su misura, rendendo HIGH PROFILE un protagonista del settore.
