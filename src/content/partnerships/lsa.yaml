desc:
  en: |-
    The goal of Legacy Sport & Art Management (LSA) is bridging the worlds of sports and arts.

    The mission of LSA is to create global opportunities for our talents — whether it's athletic careers, artistic representation, or inspiring collaborations. We believe that passion, creativity, and perseverance shape legacy. The company's founders recognized that athletes and artists face similar challenges and opportunities: they need professional representation that focuses not only on managing their careers but also on their long-term development and creating international opportunities.
  fr: |-
    L'objectif de Legacy Sport & Art Management (LSA) est de relier les mondes du sport et de l'art.

    La mission de LSA est de créer des opportunités mondiales pour nos talents — qu'il s'agisse de carrières sportives, de représentation artistique ou de collaborations inspirantes. Nous croyons que la passion, la créativité et la persévérance forgent l'héritage. Les fondateurs de l'entreprise ont reconnu que les athlètes et les artistes font face à des défis et des opportunités similaires : ils ont besoin d'une représentation professionnelle qui se concentre non seulement sur la gestion de leur carrière, mais aussi sur leur développement à long terme et la création d'opportunités internationales.
  it: |-
    L'obiettivo di Legacy Sport & Art Management (LSA) è quello di unire i mondi dello sport e dell'arte.

    La missione di LSA è creare opportunità globali per i nostri talenti — che si tratti di carriere atletiche, rappresentanza artistica o collaborazioni ispiratrici. Crediamo che passione, creatività e perseveranza plasmino l'eredità. I fondatori dell'azienda hanno riconosciuto che atleti e artisti affrontano sfide e opportunità simili: necessitano di una rappresentanza professionale che si concentri non solo sulla gestione delle loro carriere, ma anche sul loro sviluppo a lungo termine e sulla creazione di opportunità internazionali.
