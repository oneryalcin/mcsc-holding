desc:
  en: >
    M3 (Monaco) leads the way in marina and yacht club consulting, blending
    expertise, innovation, and sustainability. They transform marinas into
    vibrant hubs of tourism and economic growth while prioritizing environmental
    responsibility. M3 aims to redefine the future of marinas and yacht clubs by
    turning them into true nautical lifestyle places, drawing traction and
    attractiveness for tourism and economic growth, while placing environmental
    responsibility at the heart of their concerns.
  fr: M3 (Monaco) est un acteur de référence dans le conseil aux marinas et aux
    yacht clubs, alliant expertise, innovation et durabilité. L’entreprise
    transforme les marinas en véritables pôles d’attractivité, moteurs du
    tourisme et du développement économique, tout en plaçant la responsabilité
    environnementale au cœur de sa démarche. M3 a pour ambition de redéfinir
    l’avenir des marinas et des yacht clubs en les transformant en véritables
    lieux de vie dédiés à l’art de vivre nautique, capables de renforcer leur
    attractivité touristique et leur impact économique, tout en intégrant les
    enjeux environnementaux au centre de leur développement.
  it: M3 (Monaco) è un punto di riferimento nella consulenza per marine e yacht
    club, combinando competenza, innovazione e sostenibilità. L’azienda
    trasforma le marine in veri e propri poli di attrazione, capaci di
    promuovere il turismo e lo sviluppo economico, ponendo al tempo stesso la
    responsabilità ambientale al centro della propria visione. M3 punta a
    ridefinire il futuro delle marine e degli yacht club, trasformandoli in
    autentici luoghi dedicati al lifestyle nautico, in grado di accrescere la
    loro attrattività turistica e il loro valore economico, mantenendo la
    responsabilità ambientale al centro di ogni progetto.
