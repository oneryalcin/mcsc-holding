name: Repeople Network
url: https://www.repeoplenetwork.net/
logo: /images/network/repeople-network.jpg
order: 3
desc:
  en: |-
    Repeople Network facilitates connections and relationships among professionals in the world of real estate and alternative investments.

    They foster the creation of strategic partnerships to build new business opportunities, within a framework of social and environmental responsibility. They aspire to become the go-to community for building meaningful human relationships, aimed at transforming the entrepreneurial world into a sustainable ecosystem driven by responsible investment.
  fr: |-
    Repeople Network facilite les connexions et les relations entre professionnels du monde de l'immobilier et des investissements alternatifs.

    Ils favorisent la création de partenariats stratégiques pour construire de nouvelles opportunités d'affaires, dans un cadre de responsabilité sociale et environnementale. Ils aspirent à devenir la communauté de référence pour nouer des relations humaines significatives, visant à transformer le monde entrepreneurial en un écosystème durable fondé sur l'investissement responsable.
  it: |-
    Repeople Network facilita connessioni e relazioni tra professionisti nel mondo dell'immobiliare e degli investimenti alternativi.

    Promuovono la creazione di partnership strategiche per costruire nuove opportunità di business, nell'ambito di un quadro di responsabilità sociale e ambientale. Aspirano a diventare la comunità di riferimento per costruire relazioni umane significative, con l'obiettivo di trasformare il mondo imprenditoriale in un ecosistema sostenibile guidato dagli investimenti responsabili.
