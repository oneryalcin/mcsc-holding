desc:
  en: "Whether the issue is contracts, conflicts, negotiations or procedures:
    Cassius provides legal peace of mind and commercial influence. We do this by
    thinking of solutions and acting with vision and insight into the reality of
    entrepreneurship."
  fr: "Qu’il s’agisse de contrats, de conflits, de négociations ou de procédures :
    Cassius vous apporte la sérénité juridique et un véritable levier
    d’influence commerciale. Nous y parvenons en imaginant des solutions et en
    agissant avec vision et discernement, tout en tenant compte des réalités du
    monde entrepreneurial."
  it: "Che si tratti di contratti, controversie, negoziazioni o procedimenti:
    Cassius offre serenità sul piano legale e una concreta capacità di influenza
    commerciale. Lo facciamo individuando soluzioni e agendo con visione e
    lungimiranza, tenendo conto della realtà imprenditoriale."
