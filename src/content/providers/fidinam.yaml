desc:
  en: |-
    Fidinam is a private consulting firm that was founded in Lugano (Switzerland) in 1960 and offers tax, business, real estate and digital consulting to companies, entrepreneurs and individuals.

    In over 60 years of activity, we have acquired a wealth of contacts and skills that enables us to meet the needs of clients of all types and to be ready to face the most difficult challenges posed by the markets.
  fr: |-
    Fidinam est un cabinet de conseil privé fondé à Lugano (Suisse) en 1960, qui propose des services de conseil fiscal, commercial, immobilier et numérique aux entreprises, aux entrepreneurs et aux particuliers.

    En plus de 60 ans d'activité, nous avons acquis une richesse de contacts et de compétences qui nous permet de répondre aux besoins de clients de tous types et d'être prêts à relever les défis les plus difficiles posés par les marchés.
  it: |-
    Fidinam è una società di consulenza privata fondata a Lugano (Svizzera) nel 1960, che offre consulenza fiscale, aziendale, immobiliare e digitale a società, imprenditori e privati.

    In oltre 60 anni di attività, abbiamo acquisito un patrimonio di contatti e competenze che ci consente di soddisfare le esigenze di clienti di ogni tipo e di essere pronti ad affrontare le sfide più difficili poste dai mercati.
