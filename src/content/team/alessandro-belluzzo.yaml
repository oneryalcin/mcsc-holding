bio:
  en: >-
    Alessandro graduated from Bocconi University in Milan with two degrees, in
    Economics and Law. He then obtained a Master's degree in International
    Taxation.

    Alessandro is a Barrister, registered with the Bar of England and Wales and a TEP – Trust Estate Practitioner in the UK.

    He is based in London, where he deals predominately with wealth planning for individuals and family business.

    Alessandro has lectured at Bocconi University, and frequently participates as a speaker at national and international conferences, through his role as Deputy Chair of the STEP UK Cross-Border Estates Special Interest Group.

    In 2017, Alessandro was made a Knight of the Stella d'Italia. He was nominated for this title by the Italian Ambassador in London, in recognition of Alessandro's work in promoting dialogue between the Italian and British business communities.

    In 2025, Alessandro Belluzzo was awarded the title of Officer of the Order of the Star of the Italian Republic for his efforts in modernising the Italian Chamber of Commerce for the UK, as President, and for the international growth of Belluzzo International Partners, which strengthens links between Italian and British business.

    From 2019 to 2024, he served as President of the Italian Chamber of Commerce in the United Kingdom.

    Since October 2025, Alessandro has been Professor and Director of the Department of Sport & Wealth at the European School of Economics.
  fr: >-
    Alessandro est diplômé de Bocconi University à Milan avec deux diplômes, en
    Sciences économiques et en Droit. Il a ensuite obtenu un Master en fiscalité
    internationale.

    Alessandro est Barrister, inscrit au Bar of England and Wales et TEP – Trust Estate Practitioner au Royaume-Uni.

    Il est basé à Londres, où il se consacre principalement à la planification patrimoniale pour les particuliers et les entreprises familiales.

    Alessandro a enseigné à Bocconi University et participe fréquemment en tant qu'intervenant à des conférences nationales et internationales, grâce à son rôle de Deputy Chair du STEP UK Cross-Border Estates Special Interest Group.

    En 2017, Alessandro a été fait Chevalier de la Stella d'Italia. Il a été nommé à ce titre par l'Ambassadeur d'Italie à Londres, en reconnaissance de son travail de promotion du dialogue entre les communautés d'affaires italienne et britannique.

    En 2025, Alessandro Belluzzo a reçu le titre d'Officier de l'Ordre de l'Étoile de la République italienne pour ses efforts de modernisation de la Chambre de Commerce italienne pour le Royaume-Uni, en tant que Président, et pour la croissance internationale de Belluzzo International Partners, qui renforce les liens entre les milieux d'affaires italien et britannique.

    De 2019 à 2024, il a exercé les fonctions de Président de la Chambre de Commerce italienne au Royaume-Uni.

    Depuis octobre 2025, Alessandro est Professeur et Directeur du Department of Sport & Wealth à la European School of Economics.
  it: >-
    Alessandro si è laureato presso Bocconi University a Milano con due lauree,
    in Economia e in Giurisprudenza. Ha poi conseguito un Master in fiscalità
    internazionale.

    Alessandro è Barrister, iscritto al Bar of England and Wales e TEP – Trust Estate Practitioner nel Regno Unito.

    Ha sede a Londra, dove si occupa prevalentemente di pianificazione patrimoniale per individui e imprese familiari.

    Alessandro ha insegnato presso Bocconi University e partecipa frequentemente come relatore a conferenze nazionali e internazionali, grazie al suo ruolo di Deputy Chair dello STEP UK Cross-Border Estates Special Interest Group.

    Nel 2017, Alessandro è stato insignito del titolo di Cavaliere della Stella d'Italia. È stato nominato per questo titolo dall'Ambasciatore d'Italia a Londra, in riconoscimento del suo lavoro nella promozione del dialogo tra le comunità imprenditoriali italiana e britannica.

    Nel 2025, Alessandro Belluzzo ha ricevuto il titolo di Ufficiale dell'Ordine della Stella della Repubblica Italiana per i suoi sforzi nella modernizzazione della Camera di Commercio italiana per il Regno Unito, in qualità di Presidente, e per la crescita internazionale di Belluzzo International Partners, che rafforza i legami tra il mondo degli affari italiano e britannico.

    Dal 2019 al 2024 ha ricoperto la carica di Presidente della Camera di Commercio italiana nel Regno Unito.

    Da ottobre 2025, Alessandro è Professore e Direttore del Department of Sport & Wealth presso la European School of Economics.
