  it: >-
    Ana ha iniziato a giocare a pallamano all'età di 10 anni nella sua città
    natale, Velenje. Ha esordito con la nazionale slovena a 16 anni e ha
    partecipato al suo primo grande torneo internazionale nel 2010. Nel 2017 è
    stata nominata capitana della nazionale e ha disputato il suo primo
    Campionato del Mondo in Germania — un ruolo in cui ha saputo guidare la
    squadra dentro e fuori dal campo, gestendo i rapporti tra giocatrici e staff
    e favorendo una comunicazione aperta all'interno del gruppo. Conosciuta per
    la sua capacità di ascolto, è sempre stata pronta a sostenere le compagne,
    offrire consigli e contribuire a trovare le soluzioni migliori per la
    squadra.


    A 19 anni ha lasciato la Slovenia per trascorrere 15 anni giocando all'estero. Il dover costruire la propria indipendenza fin da giovane l'ha plasmata profondamente come persona: raggiungere il vertice ha richiesto sacrifici costanti, che hanno rafforzato la sua resilienza e determinazione. Giocare accanto a compagne di molte nazionalità e culture diverse le ha inoltre permesso di imparare diverse lingue e di sviluppare una comprensione più profonda di prospettive e mentalità differenti.


    Ana ha rappresentato la Slovenia alle Olimpiadi di Parigi 2024, dove è stata portabandiera del proprio Paese, e nello stesso anno ha vinto la Champions League EHF con il suo club. Ha concluso la carriera professionistica nel giugno 2026, da miglior marcatrice di sempre della nazionale slovena con 767 gol in 159 presenze.


    Al di fuori del campo, Ana ha ricoperto diversi ruoli di leadership e istituzionali. Nel 2024 è stata eletta membro della Commissione Atlete della Federazione Internazionale di Pallamano. Dal 2019 è ambasciatrice di "Respect Your Talent", un progetto dell'EHF dedicato a sostenere, guidare e ispirare le nuove generazioni di atlete attraverso camp e presentazioni. Nel settembre 2026 è stata eletta Vicepresidente per la pallamano femminile e le relazioni internazionali della Federazione Slovena di Pallamano e, nello stesso mese, membro dell'European Handball Players Board.


