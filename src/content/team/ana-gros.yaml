bio:
  en: >-
    Ana began playing handball at the age of 10 in her hometown of Velenje. She
    made her first appearance for the Slovenian national team at 16 and competed
    in her first major international tournament in 2010. In 2017, she was named
    captain of the national team and played in her first World Championship in
    Germany — a role in which she led both on and off the court, managing
    relationships between players and staff and fostering open communication
    within the team. Known as a good listener, she has always been ready to
    support teammates, offer advice and help find the best solutions for the
    group.


    At 19, she left Slovenia and went on to spend 15 years playing abroad. Building independence from a young age shaped her significantly as a person: succeeding at the highest level required constant sacrifice, which strengthened her resilience and persistence. Playing alongside teammates of many nationalities and cultures also allowed her to learn several languages and develop a deeper understanding of different perspectives and mindsets.


    Ana represented Slovenia at the Paris 2024 Olympic Games, where she served as the country's flag bearer, and won the EHF Champions League with her club that same year. She ended her professional playing career in June 2026, as Slovenia's all-time leading scorer with 767 goals in 159 national team appearances.


    Beyond the court, Ana has taken on several leadership and institutional roles. In 2024, she was elected a member of the Athletes' Commission at the International Handball Federation. Since 2019, she has served as an ambassador for "Respect Your Talent," an EHF project supporting, mentoring and inspiring the next generation of athletes through camps and presentations. In September 2026, she was elected Vice-President for Women's Handball and International Relations of the Slovenian Handball Federation, and, in the same month, a member of the European Handball Players Board.


