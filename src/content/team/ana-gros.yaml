  fr: >
    Ana a commencé le handball à l'âge de 10 ans dans sa ville natale de
    Velenje. Elle a fait ses débuts avec l'équipe nationale slovène à 16 ans et
    a disputé son premier grand tournoi international en 2010. En 2017, elle a
    été nommée capitaine de l'équipe nationale et a joué son premier Championnat
    du Monde en Allemagne — un rôle dans lequel elle a su guider son équipe sur
    et en dehors du terrain, en gérant les relations entre joueuses et staff et
    en favorisant une communication ouverte au sein du groupe. Reconnue pour son
    écoute, elle a toujours été prête à soutenir ses coéquipières, à donner des
    conseils et à aider à trouver les meilleures solutions pour le collectif.


    À 19 ans, elle a quitté la Slovénie pour passer 15 ans à jouer à l'étranger. Avoir dû devenir autonome dès son plus jeune âge l'a considérablement façonnée en tant que personne : réussir au plus haut niveau exigeait des sacrifices constants, ce qui a renforcé sa résilience et sa persévérance. Évoluer aux côtés de coéquipières de nombreuses nationalités et cultures lui a également permis d'apprendre plusieurs langues et de développer une compréhension plus profonde de perspectives et de mentalités différentes.


    Ana a représenté la Slovénie aux Jeux Olympiques de Paris 2024, où elle a été porte-drapeau de son pays, et a remporté la Ligue des Champions EHF avec son club la même année. Elle a mis fin à sa carrière professionnelle en juin 2026, en tant que meilleure buteuse de l'histoire de l'équipe nationale slovène avec 767 buts en 159 sélections.


    En dehors du terrain, Ana a occupé plusieurs fonctions de leadership et institutionnelles. En 2024, elle a été élue membre de la Commission des Athlètes de la Fédération Internationale de Handball. Depuis 2019, elle est ambassadrice de « Respect Your Talent », un projet de l'EHF visant à soutenir, encadrer et inspirer la nouvelle génération d'athlètes à travers des camps et des présentations. En septembre 2026, elle a été élue Vice-Présidente en charge du handball féminin et des relations internationales de la Fédération Slovène de Handball, et, le même mois, membre de l'European Handball Players Board.


