bio:
  en: |-
    Cosimo Andrea Vestuti graduated in Law from the Catholic University of the Sacred Heart in Milan and has been enrolled in the Como Bar Association since 2001 and in that of advocates before the Court of Cassation and Superior Jurisdictions. In 1995 - 1996 he did an internship in Munich (Germany) at the firm 'Gloog und Wald' specialising in international contracts.
    Focusing on out-of-court advice, particularly in corporate and business matters, he provides valuable support to entrepreneurs in making strategic choices and current planning.
    He has specific knowledge in banking and finance and particular expertise in real estate transactions during the purchase, management and renovation of properties.
  fr: |-
    Cosimo Andrea Vestuti est diplômé en droit de l'Università Cattolica del Sacro Cuore de Milan. Il est inscrit au Barreau de Côme depuis 2001 et au tableau des avocats auprès de la Cour de Cassation et des juridictions supérieures. En 1995-1996, il a effectué un stage à Munich (Allemagne) au sein du cabinet « Gloog und Wald », spécialisé en contrats internationaux.
    Spécialisé dans le conseil extrajudiciaire, en particulier en matière corporate et commerciale, il apporte un soutien précieux aux entrepreneurs dans leurs choix stratégiques et leur planification courante.
    Il possède des connaissances spécifiques dans le domaine bancaire et financier ainsi qu'une expertise particulière dans les transactions immobilières lors de l'achat, la gestion et la rénovation de biens.
  it: |-
    Cosimo Andrea Vestuti si è laureato in Giurisprudenza presso l'Università Cattolica del Sacro Cuore di Milano. È iscritto all'Ordine degli Avvocati di Como dal 2001 e all'albo degli avvocati cassazionisti presso la Corte di Cassazione e le giurisdizioni superiori. Nel 1995-1996 ha svolto un tirocinio a Monaco di Baviera (Germania) presso lo studio « Gloog und Wald », specializzato in contratti internazionali.
    Concentrato sulla consulenza stragiudiziale, in particolare in materia societaria e commerciale, fornisce un prezioso supporto agli imprenditori nelle scelte strategiche e nella pianificazione corrente.
    Possiede competenze specifiche in ambito bancario e finanziario e una particolare esperienza nelle transazioni immobiliari relative all'acquisto, alla gestione e alla ristrutturazione di immobili.
