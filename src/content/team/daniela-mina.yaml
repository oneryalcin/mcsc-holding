bio:
  en: >-
    Daniela Mina has worked for years in accounting, tax and wealth advisory,
    supporting businesses, families and international entities in managing
    complex decisions.


    She is registered with the Order of Chartered Accountants and Accounting Experts of the Republic of San Marino and with the Register of Statutory Auditors.


    She holds institutional roles as Professional Trustee, Registered Agent, and member of boards of statutory auditors and control bodies, ensuring a rigorous, transparent approach in line with the highest ethical standards.


    She is a member of CFE – Tax Advisers Europe and of CILEA, international networks dedicated to the evolution of tax advisory and professional cooperation.


    Her work is distinguished by clarity, discretion and precision, with the goal of guiding every client toward sound, informed and lasting decisions.
  fr: >-
    Daniela Mina exerce depuis de nombreuses années dans le conseil comptable,
    fiscal et patrimonial, accompagnant entreprises, familles et structures
    internationales dans la gestion de décisions complexes.


    Elle est inscrite à l'Ordre des Experts-Comptables de la République de Saint-Marin ainsi qu'au Registre des Commissaires aux Comptes.


    Elle exerce des fonctions institutionnelles en tant que Trustee Professionnelle, Agent Résident et membre de collèges de commissaires aux comptes et d'organes de contrôle, garantissant une approche rigoureuse, transparente et conforme aux normes déontologiques les plus élevées.


    Elle est membre du CFE – Tax Advisers Europe et du CILEA, réseaux internationaux dédiés à l'évolution du conseil fiscal et à la coopération professionnelle.


    Son activité se distingue par sa clarté, sa discrétion et sa précision, avec pour objectif d'accompagner chaque client dans la définition de choix solides, éclairés et pérennes.
  it: >-
    Daniela Mina opera da anni nel settore della consulenza contabile, fiscale e
    patrimoniale, affiancando imprese, famiglie e realtà internazionali nella
    gestione di decisioni complesse.


    È iscritta all’Ordine dei Dottori Commercialisti ed Esperti Contabili della Repubblica di San Marino e al Registro dei Revisori Contabili.


    Ricopre incarichi istituzionali come Trustee Professionale, Agente Residente e membro di collegi sindacali e organismi di controllo, garantendo un approccio rigoroso, trasparente e conforme ai più elevati standard deontologici.


    Fa parte del CFE – Tax Advisers Europe e del CILEA, network internazionali dedicati all’evoluzione della consulenza fiscale e alla cooperazione professionale.

    La sua attività si distingue per chiarezza, riservatezza e precisione, con l’obiettivo di accompagnare ogni Cliente nella definizione di scelte solide, consapevoli e sostenibili nel tempo.
