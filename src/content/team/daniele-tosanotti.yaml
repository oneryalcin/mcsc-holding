bio:
  en: Daniele earned a law degree from the University of Genoa and is admitted to
    practice law in Italy. He specializes in contract law with a focus on the
    entertainment industry, copyright law, and real estate law, advising clients
    on a wide range of legal matters related to media, creative industries, and
    property transactions.
  fr: Daniele est titulaire d'un diplôme en droit de l'Université de Gênes et est
    admis à exercer la profession d'avocat en Italie. Il est spécialisé en droit
    des contrats, avec une expertise particulière dans les secteurs du spectacle
    et du divertissement, du droit d'auteur et du droit immobilier. Il
    accompagne ses clients sur un large éventail de questions juridiques liées
    aux médias, aux industries créatives et aux transactions immobilières.
  it: Daniele est titulaire d'un diplôme en droit de l'Université de Gênes et est
    admis à exercer la profession d'avocat en Italie. Il est spécialisé en droit
    des contrats, avec une expertise particulière dans les secteurs du spectacle
    et du divertissement, du droit d'auteur et du droit immobilier. Il
    accompagne ses clients sur un large éventail de questions juridiques liées
    aux médias, aux industries créatives et aux transactions immobilières.
