bio:
  en: >-
    Francesco Bongarrà is a newsman with a passion for high level diplomacy,
    politics, culture and academia. After having served for over 25 years as a
    political journalist and foreign correspondent for the Italian news agency
    ANSA and several other international media outlet, he was appointed Director
    of the Italian Cultural Institute in London, the "powerhouse" of Italian
    culture in the United Kingdom.

    He is also Ambassador at Large of the Republic of San Marino - he was previously Ambassador to Peru and to the International Maritime Organization - and a Distinguished Affiliate Scholar at Pembroke College, University of Cambridge. He is a Knight of Magistral Grace of the Sovereign Military Order of Malta and a Knight Grand Officer of the Order of Merit of the Italian Republic and of the Order of St Agatha (RSM). A lawyer by background, he chairs the Autorità Garante per l'Informazione (OFCOM) of the Republic of San Marino and sits on the executive boards of the Fondazione Opera Carlo Felice (Genoa, Italy) and of the Thomson Reuters Foundation Inc. (New York, USA).
  fr: >-
    Francesco Bongarrà est un homme de presse passionné par la diplomatie de
    haut niveau, la politique, la culture et le monde académique. Après plus de
    25 ans comme journaliste politique et correspondant étranger pour l'agence
    de presse italienne ANSA et plusieurs autres médias internationaux, il a été
    nommé Directeur de l'Institut culturel italien de Londres, la « powerhouse »
    de la culture italienne au Royaume-Uni.

    Il est également Ambassadeur itinérant de la République de Saint-Marin - il a précédemment été Ambassadeur au Pérou et auprès de l'Organisation maritime internationale - et Distinguished Affiliate Scholar au Pembroke College, University of Cambridge. Il est Chevalier de Grâce Magistrale de l'Ordre Souverain Militaire de Malte et Grand Officier de l'Ordre du Mérite de la République italienne ainsi que de l'Ordre de Sainte-Agathe (RSM). Juriste de formation, il préside l'Autorità Garante per l'Informazione (OFCOM) de la République de Saint-Marin et siège aux conseils exécutifs de la Fondazione Opera Carlo Felice (Gênes, Italie) et de la Thomson Reuters Foundation Inc. (New York, États-Unis).
  it: >-
    Francesco Bongarrà è un uomo di informazione con una passione per la
    diplomazia di alto livello, la politica, la cultura e il mondo accademico.
    Dopo oltre 25 anni come giornalista politico e corrispondente estero per
    l'agenzia di stampa italiana ANSA e per diversi altri media internazionali,
    è stato nominato Direttore dell'Istituto Italiano di Cultura a Londra, la
    "powerhouse" della cultura italiana nel Regno Unito.

    È inoltre Ambasciatore itinerante della Repubblica di San Marino - in precedenza è stato Ambasciatore in Perù e presso l'Organizzazione Marittima Internazionale - e Distinguished Affiliate Scholar presso il Pembroke College, University of Cambridge. È Cavaliere di Grazia Magistrale del Sovrano Militare Ordine di Malta e Grande Ufficiale dell'Ordine al Merito della Repubblica Italiana e dell'Ordine di Sant'Agata (RSM). Avvocato di formazione, presiede l'Autorità Garante per l'Informazione (OFCOM) della Repubblica di San Marino e siede nei consigli esecutivi della Fondazione Opera Carlo Felice (Genova, Italia) e della Thomson Reuters Foundation Inc. (New York, USA).
