bio:
  en: |-
    Francesco brings extensive experience in leading global organizations and delivering complex industrial projects in highly regulated, capital-intensive environments. With a multidisciplinary background spanning engineering, law, and international relations, he has held progressively senior roles within the Eni group and later at SBM Offshore.
    Throughout his career, he has contributed to the development of large-scale industrial investments and the execution of complex programs across the global energy sector. His expertise encompasses high-level negotiations, the management of complex disputes, and corporate compliance. He has also built strong institutional relationships with governments, public authorities, and international organizations, operating effectively at the intersection of industry and policy.
    In parallel, Francesco has maintained a longstanding engagement with the investment world, developing a refined perspective on long-term value creation and the strategic assessment of entrepreneurial opportunities.
    He serves as an arbitrator at the Chambre Arbitrale Maritime de Paris and is actively involved in initiatives related to the Blue Economy, industrial sustainability, and technological innovation. In 2024 and 2025, he was recognized among the "100 Who Make Monaco" for his contribution to the development of the Principality's economic and entrepreneurial ecosystem. He also collaborates with universities and academic institutions on topics related to innovation and sustainable development.
    Francesco is a co-founder and non-executive member of the Board of Directors of MCSC Group.
  fr: |-
    Francesco apporte une vaste expérience dans la direction d'organisations mondiales et la réalisation de projets industriels complexes dans des environnements fortement réglementés et à forte intensité capitalistique. Doté d'une formation pluridisciplinaire couvrant l'ingénierie, le droit et les relations internationales, il a occupé des postes de responsabilité croissante au sein du groupe Eni puis chez SBM Offshore.
    Tout au long de sa carrière, il a contribué au développement d'investissements industriels de grande envergure et à l'exécution de programmes complexes dans le secteur énergétique mondial. Son expertise couvre les négociations de haut niveau, la gestion de litiges complexes et la conformité d'entreprise. Il a également noué de solides relations institutionnelles avec des gouvernements, des autorités publiques et des organisations internationales, opérant efficacement à l'intersection de l'industrie et des politiques publiques.
    Parallèlement, Francesco entretient un engagement de longue date avec le monde de l'investissement, développant une perspective affinée sur la création de valeur à long terme et l'évaluation stratégique des opportunités entrepreneuriales.
    Il exerce en tant qu'arbitre à la Chambre Arbitrale Maritime de Paris et participe activement à des initiatives liées à l'économie bleue, à la durabilité industrielle et à l'innovation technologique. En 2024 et 2025, il a été reconnu parmi les « 100 Who Make Monaco » pour sa contribution au développement de l'écosystème économique et entrepreneurial de la Principauté. Il collabore également avec des universités et des institutions académiques sur des sujets liés à l'innovation et au développement durable.
    Francesco est cofondateur et membre non exécutif du conseil d'administration de MCSC Group.
  it: |-
    Francesco vanta una vasta esperienza nella guida di organizzazioni globali e nella realizzazione di progetti industriali complessi in ambienti fortemente regolamentati e ad alta intensità di capitale. Con una formazione multidisciplinare che spazia dall'ingegneria al diritto e alle relazioni internazionali, ha ricoperto ruoli di responsabilità crescente all'interno del gruppo Eni e successivamente presso SBM Offshore.
    Nel corso della sua carriera, ha contribuito allo sviluppo di investimenti industriali su larga scala e all'esecuzione di programmi complessi nel settore energetico globale. La sua competenza comprende negoziazioni di alto livello, la gestione di contenziosi complessi e la conformità aziendale. Ha inoltre costruito solide relazioni istituzionali con governi, autorità pubbliche e organizzazioni internazionali, operando efficacemente all'intersezione tra industria e politiche pubbliche.
    Parallelamente, Francesco ha mantenuto un impegno di lunga data nel mondo degli investimenti, sviluppando una prospettiva raffinata sulla creazione di valore a lungo termine e la valutazione strategica delle opportunità imprenditoriali.
    È arbitro presso la Chambre Arbitrale Maritime de Paris ed è attivamente coinvolto in iniziative legate all'economia blu, alla sostenibilità industriale e all'innovazione tecnologica. Nel 2024 e nel 2025 è stato riconosciuto tra i « 100 Who Make Monaco » per il suo contributo allo sviluppo dell'ecosistema economico e imprenditoriale del Principato. Collabora inoltre con università e istituzioni accademiche su temi legati all'innovazione e allo sviluppo sostenibile.
    Francesco è cofondatore e membro non esecutivo del consiglio di amministrazione di MCSC Group.
