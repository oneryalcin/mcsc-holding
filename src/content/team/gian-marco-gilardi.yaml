bio:
  en: "After his graduation in international management and following studies in financial analysis Gian Marco Gilardi has spent his whole career in banking having worked more than 20 years for different primary banks in Switzerland and Monaco. Then he joined and took over the management in 2015 of a single family office in Monaco. On the occasion of a next gen change among the family office in 2022 he has been offered to become a member of a newly created advisory board, a function that he is still occupying. He parallelly diversified his activities by setting up as minority non-managing partner an asset management company in Monaco with a longtime friend. At the same time, he has completed two master courses in private wealth management which allowed him to obtain the qualification of TEP (Trust Estate Practitioner). He finally decided that it was time to realize an old-time dream and became FIFA player agent by taking the exam in 2023. This gave him the input to set up with a previous lawyer and tax advisor and a sport manager a sport management agency in Monaco end of 2024 which later became the MCSC Group. MCSC Group operates in the form of an integrated service consulting company through an open architecture model in cooperation with partners and a network of selected strategic advisors in different fields."
  fr: "Après avoir obtenu son diplôme en management international et poursuivi des études en analyse financière, Gian Marco Gilardi a consacré l'ensemble de sa carrière au secteur bancaire, travaillant pendant plus de 20 ans pour différentes banques de premier plan en Suisse et à Monaco. Il a ensuite rejoint et pris la direction en 2015 d'un single family office à Monaco. À l'occasion d'un changement générationnel au sein du family office en 2022, il s'est vu proposer de devenir membre d'un conseil consultatif nouvellement créé, fonction qu'il occupe toujours. Parallèlement, il a diversifié ses activités en cofondant, en tant qu'associé minoritaire non gérant, une société de gestion d'actifs à Monaco avec un ami de longue date. Dans le même temps, il a suivi deux masters en gestion de patrimoine privé, ce qui lui a permis d'obtenir la qualification de TEP (Trust Estate Practitioner). Il a finalement décidé qu'il était temps de réaliser un rêve de longue date et est devenu agent de joueurs FIFA en réussissant l'examen en 2023. Cela lui a donné l'impulsion nécessaire pour créer, avec un ancien avocat et conseiller fiscal ainsi qu'un manager sportif, une agence de gestion sportive à Monaco fin 2024, qui est ensuite devenue le MCSC Group. MCSC Group opère sous la forme d'une société de conseil en services intégrés selon un modèle d'architecture ouverte, en coopération avec des partenaires et un réseau de conseillers stratégiques sélectionnés dans différents domaines."
  it: "Dopo la laurea in management internazionale e successivi studi in analisi finanziaria, Gian Marco Gilardi ha dedicato l'intera carriera al settore bancario, lavorando per oltre 20 anni presso diverse banche di primaria importanza in Svizzera e a Monaco. Ha poi raggiunto e assunto la direzione nel 2015 di un single family office a Monaco. In occasione di un cambio generazionale all'interno del family office nel 2022, gli è stato proposto di diventare membro di un consiglio consultivo di nuova creazione, funzione che ricopre tuttora. Parallelamente, ha diversificato le proprie attività cofondando, in qualità di socio di minoranza non gestore, una società di gestione patrimoniale a Monaco con un amico di lunga data. Contemporaneamente, ha completato due master in gestione del patrimonio privato che gli hanno permesso di ottenere la qualifica di TEP (Trust Estate Practitioner). Ha infine deciso che era giunto il momento di realizzare un sogno di lunga data e nel 2023 è diventato agente di calciatori FIFA superando l'esame. Questo gli ha dato lo stimolo per fondare, insieme a un precedente avvocato e consulente fiscale e a un manager sportivo, un'agenzia di gestione sportiva a Monaco alla fine del 2024, che in seguito è divenuta il MCSC Group. MCSC Group opera nella forma di una società di consulenza a servizi integrati secondo un modello di architettura aperta, in cooperazione con partner e una rete di consulenti strategici selezionati in diversi ambiti."
