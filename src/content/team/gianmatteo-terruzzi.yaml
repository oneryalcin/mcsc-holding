bio:
  en: |-
    Gianmatteo Terruzzi graduated in Economics and Business Administration from the Università Cattolica del Sacro Cuore in Milan and developed his professional foundation within a leading international auditing firm before expanding his expertise across top-tier tax advisory practices in London and Switzerland.
    He subsequently held the role of Chief Financial Officer and Head of Operations for a prominent private equity platform focused on the consumer and luxury sectors, overseeing complex, multi-jurisdictional operations across Luxembourg, Switzerland and Italy. This experience shaped a distinctive, strategic perspective combining financial governance, operational execution and cross-border structuring.
    He is the founder of LVT Advisors Group, an independent advisory firm delivering integrated tax, corporate and strategic services to international clients across Switzerland, Italy and India, with a strong focus on complex cross-border environments.
    A Certified Accountant in the Canton of Ticino, he advises on internationalisation strategies, cross-border structuring and nearshoring projects, with recognised expertise in real estate investments and renewable energy development, supporting investors throughout the full lifecycle of their projects.
    Since 2023, he has been Of Counsel at Vester Partners (Milan and Como), where he assists domestic and international clients in the design and implementation of nearshoring strategies, as well as in global mobility and cross-border operational frameworks.
    He holds the Independent Director certification issued by the Indian Institute of Corporate Affairs (IICA) and has built significant governance experience within international environments.
    He currently serves on several boards in Switzerland and sits on the board of a company listed on the Mumbai Stock Exchange, where he chairs the Risk Management Committee and is a member of the Audit Committee.
  fr: |-
    Gianmatteo Terruzzi est diplômé en Sciences économiques et gestion des entreprises de l'Università Cattolica del Sacro Cuore de Milan et a développé ses bases professionnelles au sein d'un cabinet d'audit international de premier plan avant d'élargir son expertise dans des cabinets de conseil fiscal de premier rang à Londres et en Suisse.
    Il a ensuite occupé le poste de Chief Financial Officer et Head of Operations pour une plateforme de private equity de premier plan, spécialisée dans les secteurs de la consommation et du luxe, supervisant des opérations complexes et multi-juridictionnelles au Luxembourg, en Suisse et en Italie. Cette expérience a forgé une perspective stratégique distinctive combinant gouvernance financière, exécution opérationnelle et structuration transfrontalière.
    Il est le fondateur de LVT Advisors Group, un cabinet de conseil indépendant offrant des services intégrés en fiscalité, droit des sociétés et stratégie à des clients internationaux en Suisse, en Italie et en Inde, avec un accent particulier sur les environnements transfrontaliers complexes.
    Expert-comptable agréé dans le Canton du Tessin, il conseille sur les stratégies d'internationalisation, la structuration transfrontalière et les projets de nearshoring, avec une expertise reconnue dans les investissements immobiliers et le développement des énergies renouvelables, accompagnant les investisseurs tout au long du cycle de vie de leurs projets.
    Depuis 2023, il est Of Counsel chez Vester Partners (Milan et Côme), où il assiste des clients nationaux et internationaux dans la conception et la mise en œuvre de stratégies de nearshoring, ainsi que dans les cadres de mobilité mondiale et d'opérations transfrontalières.
    Il détient la certification Independent Director délivrée par l'Indian Institute of Corporate Affairs (IICA) et a acquis une expérience significative en gouvernance dans des environnements internationaux.
    Il siège actuellement dans plusieurs conseils d'administration en Suisse et au conseil d'administration d'une société cotée à la Mumbai Stock Exchange, où il préside le Risk Management Committee et est membre de l'Audit Committee.
  it: |-
    Gianmatteo Terruzzi si è laureato in Economia e Amministrazione aziendale presso l'Università Cattolica del Sacro Cuore di Milano e ha sviluppato le proprie basi professionali all'interno di una primaria società di revisione internazionale prima di ampliare la propria competenza presso studi di consulenza fiscale di primo livello a Londra e in Svizzera.
    Ha successivamente ricoperto il ruolo di Chief Financial Officer e Head of Operations per un'importante piattaforma di private equity focalizzata sui settori consumer e lusso, supervisionando operazioni complesse e multi-giurisdizionali tra Lussemburgo, Svizzera e Italia. Questa esperienza ha forgiato una prospettiva strategica distintiva che combina governance finanziaria, esecuzione operativa e strutturazione transfrontaliera.
    È il fondatore di LVT Advisors Group, una società di consulenza indipendente che offre servizi integrati in ambito fiscale, societario e strategico a clienti internazionali in Svizzera, Italia e India, con un forte focus su ambienti transfrontalieri complessi.
    Commercialista abilitato nel Cantone Ticino, fornisce consulenza su strategie di internazionalizzazione, strutturazione transfrontaliera e progetti di nearshoring, con competenza riconosciuta negli investimenti immobiliari e nello sviluppo delle energie rinnovabili, accompagnando gli investitori lungo l'intero ciclo di vita dei loro progetti.
    Dal 2023 è Of Counsel presso Vester Partners (Milano e Como), dove assiste clienti nazionali e internazionali nella progettazione e implementazione di strategie di nearshoring, nonché in framework di mobilità globale e operazioni transfrontaliere.
    Detiene la certificazione di Independent Director rilasciata dall'Indian Institute of Corporate Affairs (IICA) e ha maturato una significativa esperienza di governance in contesti internazionali.
    Attualmente siede in diversi consigli di amministrazione in Svizzera ed è membro del consiglio di una società quotata alla Mumbai Stock Exchange, dove presiede il Risk Management Committee ed è membro dell'Audit Committee.
