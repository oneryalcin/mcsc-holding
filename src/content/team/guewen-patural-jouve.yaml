bio:
  en: >-
    Guewen Patural-Jouve operates at the intersection of luxury, art and
    entrepreneurship. His career is guided by a deep conviction: great houses
    and the most sustainable projects are built on a combination of a strong
    heritage, a strategic vision and a constant pursuit of excellence.


    Coming from a family whose history is intimately linked to the world of creativity, he developed a particular appreciation for the decorative arts, design and craftsmanship from a very young age. As the great-grandson of Georges Jouve, one of the great French ceramicists of the 20th century, he grew up in an environment where the dialogue between heritage, innovation and creativity was a constant source of inspiration. This close connection with works of art, collectors and artisans has profoundly shaped his understanding of the cultural and economic value of craftsmanship.


    Trained at the Institut Français de la Mode, he complemented this artistic background with an understanding of management, strategy and the contemporary challenges facing the luxury industry. His career path then led him to join TOD’S, where he deepened his understanding of the demands of an international brand, the relationship with a discerning clientele, and the mechanisms that contribute to the influence of heritage houses.


    Through his various experiences, Guewen has developed a cross-disciplinary perspective on the worlds of luxury, fashion, art and image. He is particularly interested in the dynamics that enable the creation of lasting value: the preservation of heritage, the development of talent, innovation and the building of brands capable of spanning generations.


    Driven by an approach that is both entrepreneurial and international, he believes that luxury is defined not solely by the excellence of a product, but by the ability to convey a story, values and emotion. His career reflects this constant quest for a balance between tradition and modernity, culture and performance, creativity and strategy.
  fr: >-
    Guewen Patural-Jouve évolue à la croisée des univers du luxe, de l'art et de
    l'entrepreneuriat. Son parcours est guidé par une conviction profonde : les
    plus grandes maisons et les projets les plus pérennes reposent sur
    l'alliance d'un héritage fort, d'une vision stratégique et d'une recherche
    constante de l'excellence.


    Issu d'une famille étroitement liée au monde de la création, il développe dès son plus jeune âge une véritable sensibilité aux arts décoratifs, au design et à l'artisanat. Arrière-petit-fils de Georges Jouve, l'un des grands céramistes français du XXᵉ siècle, il grandit dans un environnement où le dialogue entre patrimoine, innovation et créativité constitue une source permanente d'inspiration. Cette proximité avec les œuvres d'art, les collectionneurs et les artisans a profondément façonné sa compréhension de la valeur culturelle et économique du savoir-faire.


    Diplômé de l'Institut Français de la Mode, il complète cette sensibilité artistique par une solide compréhension du management, de la stratégie et des enjeux contemporains de l'industrie du luxe. Il rejoint ensuite TOD'S, où il approfondit sa connaissance des exigences d'une grande maison internationale, de la relation avec une clientèle exigeante et des mécanismes qui contribuent au rayonnement des maisons patrimoniales.


    Au fil de son parcours, Guewen a développé une vision transversale des univers du luxe, de la mode, de l'art et du branding. Il s'intéresse tout particulièrement aux leviers de création de valeur à long terme : la préservation du patrimoine, le développement des talents, l'innovation et la construction de marques capables de traverser les générations.


    Animé par une approche à la fois entrepreneuriale et internationale, il considère que le luxe ne se définit pas uniquement par l'excellence d'un produit, mais également par la capacité à transmettre une histoire, des valeurs et une émotion. Son parcours reflète cette recherche constante d'équilibre entre tradition et modernité, culture et performance, créativité et stratégie.
  it: >-
    Guewen Patural-Jouve opera all'intersezione tra lusso, arte e
    imprenditorialità. Il suo percorso professionale è guidato da una profonda
    convinzione: le grandi maison e i progetti più duraturi nascono dalla
    combinazione di una solida eredità, di una visione strategica e di una
    costante ricerca dell'eccellenza.


    Proveniente da una famiglia profondamente legata al mondo della creatività, ha sviluppato fin da giovane una particolare sensibilità per le arti decorative, il design e l'artigianato. Pronipote di Georges Jouve, uno dei più importanti ceramisti francesi del XX secolo, è cresciuto in un ambiente in cui il dialogo tra patrimonio, innovazione e creatività rappresentava una continua fonte di ispirazione. Questo stretto legame con le opere d'arte, i collezionisti e gli artigiani ha profondamente influenzato la sua comprensione del valore culturale ed economico del savoir-faire.


    Diplomato all'Institut Français de la Mode, ha affiancato a questa formazione artistica una solida conoscenza del management, della strategia e delle sfide contemporanee del settore del lusso. Successivamente è entrato a far parte di TOD'S, dove ha approfondito la conoscenza delle esigenze di una maison internazionale, del rapporto con una clientela altamente qualificata e delle dinamiche che contribuiscono al prestigio dei marchi storici.


    Nel corso della sua carriera, Guewen ha sviluppato una visione trasversale dei mondi del lusso, della moda, dell'arte e del branding. Si interessa in particolare ai fattori che consentono di creare valore nel lungo periodo: la tutela del patrimonio, lo sviluppo dei talenti, l'innovazione e la costruzione di marchi capaci di attraversare le generazioni.


    Guidato da una visione imprenditoriale e internazionale, ritiene che il lusso non sia definito soltanto dall'eccellenza di un prodotto, ma anche dalla capacità di trasmettere una storia, dei valori e un'emozione. Il suo percorso riflette una costante ricerca di equilibrio tra tradizione e modernità, cultura e performance, creatività e strategia.
