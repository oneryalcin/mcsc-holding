bio:
  en: >-
    Attorney José Marco Casellini is the CEO of M3 Monaco, a consulting and
    certification firm based in Monaco that specialises in the creation,
    development, and sustainable management of marinas, yacht clubs, and sailing
    academies. At the same time, he leads a well-known International Corporate
    Lawyer counting on a long-lasting experience as an Asset Manager with a long
    and successful business track record.
     
    Endowed with extensive knowledge in legal, financial, and strategic advisory matters, he contributes to the development of high-value projects with a focus on Innovation, Sustainability, and long-term Performance. A passionate sailing enthusiast and Advocate of Ocean Protection, he has long promoted the vision of marinas as more than infrastructure assets, supporting their evolution into dynamic waterfront environments that combine hospitality, services, and responsible development.
     
    His background in law, finance, and business leadership underpins his commitment to advancing Sustainable and Value-generating Marina, and Yacht club concepts. 
  fr: >-
    Maître José Marco Casellini est le CEO de M3 Monaco, une société de conseil
    et de certification basée à Monaco, spécialisée dans la création, le
    développement et la gestion durable de ports de plaisance, de yacht-clubs et
    d’académies de voile. Parallèlement, il dirige un cabinet reconnu d’avocat
    d’affaires international et s’appuie sur une longue expérience en tant
    qu’Asset Manager, ainsi que sur un parcours entrepreneurial solide et
    couronné de succès.


    Fort d’une expertise approfondie en matière de conseil juridique, financier et stratégique, il contribue au développement de projets à forte valeur ajoutée, avec un intérêt particulier pour l’Innovation, la Durabilité et la Performance à long terme. Passionné de voile et engagé dans la protection des océans, il défend depuis de nombreuses années une vision des ports de plaisance qui va au-delà de leur simple fonction d’infrastructure, en accompagnant leur évolution vers des environnements dynamiques en bord de mer, combinant hospitalité, services et développement responsable.


    Son parcours dans les domaines du droit, de la finance et de la direction d’entreprise nourrit son engagement en faveur du développement de concepts de ports de plaisance et de yacht-clubs durables et créateurs de valeur.
  it: >-
    L’Avvocato José Marco Casellini è il CEO di M3 Monaco, società di consulenza
    e certificazione con sede a Monaco, specializzata nella creazione, nello
    sviluppo e nella gestione sostenibile di porti turistici, yacht club e
    accademie di vela. Parallelamente, dirige un rinomato studio legale
    internazionale e vanta una lunga esperienza come Asset Manager, oltre a un
    solido e comprovato percorso professionale e imprenditoriale.


    Grazie a una vasta esperienza nel campo della consulenza legale, finanziaria e strategica, contribuisce allo sviluppo di progetti ad alto valore aggiunto, con particolare attenzione all’Innovazione, alla Sostenibilità e alle Performance di lungo periodo. Appassionato di vela e sostenitore della protezione degli oceani, da molti anni promuove una visione dei porti turistici che va oltre la loro semplice funzione infrastrutturale, accompagnandone l’evoluzione verso ambienti dinamici sul waterfront, capaci di integrare ospitalità, servizi e sviluppo responsabile.


    Il suo percorso professionale nei settori del diritto, della finanza e della gestione d’impresa rafforza il suo impegno nello sviluppo di concept di porti turistici e yacht club sostenibili e capaci di generare valore.
