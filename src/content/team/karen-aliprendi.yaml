bio:
  fr: >-
    Karen ALIPRENDI est née en Principauté de Monaco.


    Après un parcours en école de commerce, elle intègre le groupe familial spécialisé dans le transport de luxe à Monaco en tant que Manager, puis Vice-Présidente de la SAM, à travers laquelle elle participe à son développement et à sa restructuration. Toujours très investie et en quête de nouveaux défis, elle sera élue, 7 ans plus tard, Présidente du Groupement d’Intérêt Economique des Limousines de la Principauté pour un mandat de 2 ans. 


    En 2018, Karen ALIPRENDI se voit occuper le poste de Conseillère Nationale avec la volonté de servir son Pays avec passion et engagement. Elle connait ainsi parfaitement les spécificités économiques, sociales et politiques liées à la Principauté de Monaco. 


    Elle sera, deux ans plus tard, au sein d'un Single Family Office, afin d'acquérir une expérience professionnelle qui lui permet de confirmer ses compétences dans ce domaine et de tisser des liens de confiance avec un réseau de professionnels sérieux, de grande qualité et qui partagent son sens de l'éthique. 


    Aujourd’hui, Karen ALIPRENDI fonde KA PARTNER et accompagne avec beaucoup d’investissement, d’écoute et un grand professionnalisme chacun de ses clients. 
  en: >-
    Karen ALIPRENDI was born in the Principality of Monaco. 


    After her studies in a business school, she joined the family group specialized in luxury transport in Monaco as a Manager, then as a Vice-President, through which she contributed to its development and restructuring. Always very committed and in search of new challenges, she was elected, seven years later, President of the Economic Interest Group of Limousines of the Principality for a two-year term. 


    In 2018, she took on the role of Senator with the desire to serve her country with passion and commitment. She thus has a deep understanding of the economic, social, and political specificities related to the Principality of Monaco. Later, she joined a Single Family Office to gain professional experience that would allow her to confirm her skills in this field and build trusting relationships with professionals, sharing the same sense of ethics, always surrounded by high quality partners. 


    Today, she founded KA PARTNER, offering each of her clients exceptional attentiveness and professionalism.
  it: >-
    Karen ALIPRENDI è nata nel Principato di Monaco.


    Dopo gli studi in una business school, è entrata nel gruppo di famiglia specializzato nel trasporto di lusso a Monaco come Manager, poi come Vice-Presidente, contribuendo così al suo sviluppo e alla sua ristrutturazione. Sempre molto impegnata e alla ricerca di nuove sfide, sette anni dopo è stata eletta Presidente del Gruppo di Interesse Economico delle Limousine del Principato per un mandato di due anni.


    Nel 2018 ha assunto il ruolo di Senatrice, con il desiderio di servire il proprio Paese con passione e impegno. Ha così acquisito una profonda conoscenza delle specificità economiche, sociali e politiche legate al Principato di Monaco. In seguito, è entrata in un Single Family Office per maturare un'esperienza professionale che le permettesse di consolidare le proprie competenze in questo ambito e costruire relazioni di fiducia con professionisti che condividono lo stesso senso di etica, circondandosi sempre di partner di alta qualità.


    Oggi ha fondato KA PARTNER, offrendo a ciascuno dei suoi clienti un'attenzione e una professionalità d'eccezione.
