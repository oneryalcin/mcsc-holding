bio:
  en: |-
    Lada Alekseeva is a media and communications professional with an international background in sports, journalism, digital media, and strategic communications.
    Lada holds an academic qualification in journalism. Throughout her career, she has worked across television, international sports organizations, and corporate communications, developing expertise in content strategy, media relations, storytelling, and audience engagement.
    Before joining MCSC Group, Lada worked in sports media and broadcasting environments (FIFA, Copa 90, NEP, CEV), contributing to international projects and covering major sporting events. Her experience includes editorial production, live content, social media management, and communication initiatives aimed at connecting institutions, brands, athletes, and audiences across different markets.
    At MCSC Group, she oversees media and communication activities, including digital strategy, social media development, website management, content creation, partnerships, and brand positioning. She also contributes to strengthening the Group's visibility through strategic storytelling and communication initiatives designed to highlight MCSC's expertise and international network.
  fr: |-
    Lada Alekseeva est une professionnelle des médias et de la communication, dotée d'une expérience internationale dans les domaines du sport, du journalisme, des médias numériques et de la communication stratégique.
    Lada est titulaire d'une qualification académique en journalisme. Tout au long de sa carrière, elle a travaillé dans la télévision, au sein d'organisations sportives internationales et dans la communication d'entreprise, développant une expertise en stratégie de contenu, relations avec les médias, storytelling et engagement des audiences.
    Avant de rejoindre MCSC Group, Lada a travaillé dans les environnements des médias sportifs et de la diffusion (FIFA, Copa 90, NEP, CEV), contribuant à des projets internationaux et à la couverture d'événements sportifs majeurs. Son expérience comprend la production éditoriale, le contenu en direct, la gestion des réseaux sociaux et des initiatives de communication visant à relier institutions, marques, athlètes et publics sur différents marchés.
    Au sein de MCSC Group, elle supervise les activités médias et communication, notamment la stratégie numérique, le développement des réseaux sociaux, la gestion du site web, la création de contenu, les partenariats et le positionnement de la marque. Elle contribue également à renforcer la visibilité du Groupe grâce à un storytelling stratégique et à des initiatives de communication conçues pour mettre en valeur l'expertise et le réseau international de MCSC.
  it: |-
    Lada Alekseeva è una professionista dei media e della comunicazione con un background internazionale nello sport, nel giornalismo, nei media digitali e nella comunicazione strategica.
    Lada possiede una qualifica accademica in giornalismo. Nel corso della sua carriera ha lavorato nella televisione, in organizzazioni sportive internazionali e nella comunicazione aziendale, sviluppando competenze in strategia dei contenuti, relazioni con i media, storytelling e coinvolgimento del pubblico.
    Prima di entrare in MCSC Group, Lada ha lavorato in ambienti dei media sportivi e della trasmissione (FIFA, Copa 90, NEP, CEV), contribuendo a progetti internazionali e alla copertura di importanti eventi sportivi. La sua esperienza comprende la produzione editoriale, i contenuti live, la gestione dei social media e iniziative di comunicazione volte a collegare istituzioni, brand, atleti e pubblico in diversi mercati.
    In MCSC Group, supervisiona le attività di media e comunicazione, tra cui la strategia digitale, lo sviluppo dei social media, la gestione del sito web, la creazione di contenuti, le partnership e il posizionamento del brand. Contribuisce inoltre a rafforzare la visibilità del Gruppo attraverso uno storytelling strategico e iniziative di comunicazione concepite per mettere in evidenza l'expertise e la rete internazionale di MCSC.
