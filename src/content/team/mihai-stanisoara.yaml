bio:
  en: >-
    Mihai Stănișoară is General Manager of Solution Masters & Partners SRL (2024
    – present). He has extensive experience, established credibility and
    networks in government relations, defence and security policy, and
    institutional and business relations in Romania and the wider Central and
    Eastern European and Euro-Atlantic context.


    He served as a member of the Chamber of Deputies (2000–2007 and 2012–2014) and of the Senate (2008–2012) of the Parliament of Romania. He was Minister of National Defense (2008–2009) and Presidential Advisor for National Security (2007–2008). He was also Head of the Romanian Parliamentary Delegation to the OSCE Parliamentary Assembly (2000–2004) and Chairman of the Committee for Defense, Public Order, and National Security (2004–2007), as well as Secretary General of the Ministry of National Defense (2000).


    He was also President (1994–2000) and Secretary General (1992–1994) of the Mehedinți Chamber of Commerce and Industry. His earlier roles include Engineer at the Measuring and Control Instruments Factory in Drobeta Turnu Severin, Design Engineer at the Research and Technological Engineering Center for Household Appliances, Timișoara (1989–1990), and University Assistant at the Technical University of Timișoara (1988–1990).


    Professional Experience:


    2024 – present — General Manager, Solution Masters & Partners SRL

    2020–2024 — Business Development Consultant, CSR SRL

    2015–2020 — General Manager, GSS Global Specialty Service SRL

    2012–2014 — Member of the Chamber of Deputies, Parliament of Romania

    2008–2012 — Member of the Senate, Parliament of Romania

    2008–2009 — Minister of National Defense

    2007–2008 — Presidential Advisor for National Security

    2004–2007 — Chairman, Committee for Defense, Public Order, and National Security

    2000–2007 — Member of the Chamber of Deputies, Parliament of Romania

    2000–2004 — Head of the Romanian Parliamentary Delegation to the OSCE Parliamentary Assembly

    2000 — Secretary General, Ministry of National Defense

    1994–2000 — President, Mehedinți Chamber of Commerce and Industry

    1992–1994 — Secretary General, Mehedinți Chamber of Commerce and Industry

    1989–1990 — Design Engineer, Research and Technological Engineering Center for Household Appliances, Timișoara

    1988–1990 — University Assistant, Technical University of Timișoara

    Engineer, Measuring and Control Instruments Factory, Drobeta Turnu Severin


    Education:


    NATO Defense College, Rome — Course for Generals, Flag Officers, and Ambassadors (2006)

    Higher College for National Security (2005)

    PhD in Technical Sciences, Technical University of Timișoara (2003)

    National Defense College (2001)

    Faculty of Mechanics, Polytechnic Institute of Timișoara (1986)

    Short-term courses in management, marketing, and business evaluation, in Romania and abroad
  fr: >
    Mihai Stănișoară est Directeur général de Solution Masters & Partners SRL
    (2024 – aujourd’hui). Il possède une vaste expérience, une crédibilité
    établie et des réseaux dans les relations avec les gouvernements, la
    politique de défense et de sécurité, ainsi que les relations
    institutionnelles et commerciales en Roumanie et dans l’ensemble de l’Europe
    centrale et orientale et de l’espace euro-atlantique.


    Il a siégé à la Chambre des députés (2000–2007 et 2012–2014) et au Sénat (2008–2012) du Parlement roumain. Il a été ministre de la Défense nationale (2008–2009) et conseiller présidentiel pour la sécurité nationale (2007–2008). Il a également été chef de la délégation parlementaire roumaine à l’Assemblée parlementaire de l’OSCE (2000–2004) et président de la Commission de la défense, de l’ordre public et de la sécurité nationale (2004–2007), ainsi que secrétaire général du ministère de la Défense nationale (2000).


    Il a par ailleurs été président (1994–2000) et secrétaire général (1992–1994) de la Chambre de commerce et d’industrie de Mehedinți. Parmi ses fonctions antérieures figurent celles d’ingénieur à l’Usine d’instruments de mesure et de contrôle de Drobeta Turnu Severin, d’ingénieur de conception au Centre de recherche et d’ingénierie technologique pour l’électroménager de Timișoara (1989–1990) et d’assistant universitaire à l’Université technique de Timișoara (1988–1990).


    Parcours professionnel:


