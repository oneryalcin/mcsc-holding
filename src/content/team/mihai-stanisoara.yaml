  it: >
    Mihai Stănișoară è Direttore generale di Solution Masters & Partners SRL
    (2024 – oggi). Vanta un’ampia esperienza, una credibilità consolidata e reti
    di contatti nelle relazioni con i governi, nella politica di difesa e
    sicurezza e nelle relazioni istituzionali e commerciali in Romania e
    nell’area più ampia dell’Europa centro-orientale e euro-atlantica.


    È stato membro della Camera dei deputati (2000–2007 e 2012–2014) e del Senato (2008–2012) del Parlamento romeno. È stato Ministro della Difesa Nazionale (2008–2009) e Consigliere presidenziale per la sicurezza nazionale (2007–2008). È stato inoltre Capo della delegazione parlamentare romena presso l’Assemblea parlamentare dell’OSCE (2000–2004) e Presidente della Commissione Difesa, Ordine Pubblico e Sicurezza Nazionale (2004–2007), nonché Segretario generale del Ministero della Difesa Nazionale (2000).


    È stato inoltre Presidente (1994–2000) e Segretario generale (1992–1994) della Camera di Commercio e Industria di Mehedinți. Tra i suoi incarichi precedenti figurano quelli di ingegnere presso la Fabbrica di strumenti di misura e controllo di Drobeta Turnu Severin, ingegnere progettista presso il Centro di ricerca e ingegneria tecnologica per gli elettrodomestici di Timișoara (1989–1990) e assistente universitario presso l’Università Tecnica di Timișoara (1988–1990).


    Esperienza professionale:


    2024 – oggi — Direttore generale, Solution Masters & Partners SRL

    2020–2024 — Consulente per lo sviluppo commerciale, CSR SRL

    2015–2020 — Direttore generale, GSS Global Specialty Service SRL

    2012–2014 — Membro della Camera dei deputati, Parlamento di Romania

    2008–2012 — Membro del Senato, Parlamento di Romania

    2008–2009 — Ministro della Difesa Nazionale

    2007–2008 — Consigliere presidenziale per la sicurezza nazionale

    2004–2007 — Presidente della Commissione Difesa, Ordine Pubblico e Sicurezza Nazionale

    2000–2007 — Membro della Camera dei deputati, Parlamento di Romania

    2000–2004 — Capo della delegazione parlamentare romena presso l’Assemblea parlamentare dell’OSCE

    2000 — Segretario generale, Ministero della Difesa Nazionale

    1994–2000 — Presidente, Camera di Commercio e Industria di Mehedinți

    1992–1994 — Segretario generale, Camera di Commercio e Industria di Mehedinți

    1989–1990 — Ingegnere progettista, Centro di ricerca e ingegneria tecnologica per gli elettrodomestici, Timișoara

    1988–1990 — Assistente universitario, Università Tecnica di Timișoara

    Ingegnere, Fabbrica di strumenti di misura e controllo, Drobeta Turnu Severin


