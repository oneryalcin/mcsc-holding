    2020–2024 — Consultant en développement commercial, CSR SRL

    2015–2020 — Directeur général, GSS Global Specialty Service SRL

    2012–2014 — Membre de la Chambre des députés, Parlement de Roumanie

    2008–2012 — Membre du Sénat, Parlement de Roumanie

    2008–2009 — Ministre de la Défense nationale

    2007–2008 — Conseiller présidentiel pour la sécurité nationale

    2004–2007 — Président de la Commission de la défense, de l’ordre public et de la sécurité nationale

    2000–2007 — Membre de la Chambre des députés, Parlement de Roumanie

    2000–2004 — Chef de la délégation parlementaire roumaine à l’Assemblée parlementaire de l’OSCE

    2000 — Secrétaire général, ministère de la Défense nationale

    1994–2000 — Président, Chambre de commerce et d’industrie de Mehedinți

    1992–1994 — Secrétaire général, Chambre de commerce et d’industrie de Mehedinți

    1989–1990 — Ingénieur de conception, Centre de recherche et d’ingénierie technologique pour l’électroménager, Timișoara

    1988–1990 — Assistant universitaire, Université technique de Timișoara

    Ingénieur, Usine d’instruments de mesure et de contrôle, Drobeta Turnu Severin


