bio:
  en: "Nathan Cordero di Montezemolo graduated in Management and gained valuable experience in the worlds of Formula 1, marketing and events, working across high-performance and brand-driven environments. In 2024, he joined MCSC Management, bringing his strategic insight and international perspective to the team."
  fr: "Nathan Cordero di Montezemolo a obtenu un diplôme en Management et acquis une expérience précieuse dans les univers de la Formule 1, du marketing et de l'événementiel, évoluant dans des environnements axés sur la haute performance et l'image de marque. En 2024, il a rejoint MCSC Management, apportant sa vision stratégique et sa perspective internationale à l'équipe."
  it: "Nathan Cordero di Montezemolo si è laureato in Management e ha maturato preziosa esperienza nei mondi della Formula 1, del marketing e degli eventi, operando in ambienti ad alte prestazioni e orientati al brand. Nel 2024 è entrato in MCSC Management, portando la sua visione strategica e la sua prospettiva internazionale al team."
