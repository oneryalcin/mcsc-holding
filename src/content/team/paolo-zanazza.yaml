bio:
  en: |-
    Paolo Zanazza is a founding partner of the Law Firm and is specialised in domestic and international commercial and contract law.
    Paolo began his career at Rödl & Partner, a leading German law firm, where he was part of the M&A German Desk team. After working with the legal team at KPMG, he joined the Studio Legale Avv. Massimo G. Pedrazzini SA in Lugano in 2015, where he has since been advising Swiss and international clients.
    He has extensive experience in corporate law, investment funds, national and cross-border M&A transactions, commercial contracts, financial market regulation, real estate law, corporate governance, and trusts.
    He holds a law degree from Bocconi University in Milan, as well as a Joint Degree in International and Business Law from the Freie Universität of Berlin and the University of Paris XII. Additionally, he has a degree in economics and company law, and two Certificates of Advanced Studies in Legal Principles of Companies and in Legal Analysis of Companies from the Scuola universitaria professionale della Svizzera italiana.
    He is a member of the board of directors of several companies, including Caimato SA, Terzerina SA and Tifina Holding SA.
  fr: |-
    Paolo Zanazza est associé fondateur du cabinet d'avocats et est spécialisé en droit commercial et contractuel national et international.
    Paolo a débuté sa carrière chez Rödl & Partner, un cabinet d'avocats allemand de premier plan, au sein de l'équipe M&A German Desk. Après avoir travaillé avec l'équipe juridique de KPMG, il a rejoint le Studio Legale Avv. Massimo G. Pedrazzini SA à Lugano en 2015, où il conseille depuis lors des clients suisses et internationaux.
    Il possède une vaste expérience en droit des sociétés, fonds d'investissement, opérations de M&A nationales et transfrontalières, contrats commerciaux, réglementation des marchés financiers, droit immobilier, gouvernance d'entreprise et trusts.
    Il est titulaire d'un diplôme en droit de Bocconi University à Milan, ainsi que d'un Joint Degree en droit international et des affaires de la Freie Universität de Berlin et de l'University of Paris XII. Il détient également un diplôme en sciences économiques et droit des sociétés, ainsi que deux Certificates of Advanced Studies en principes juridiques des sociétés et en analyse juridique des sociétés de la Scuola universitaria professionale della Svizzera italiana.
    Il est membre du conseil d'administration de plusieurs sociétés, dont Caimato SA, Terzerina SA et Tifina Holding SA.
  it: |-
    Paolo Zanazza è socio fondatore dello studio legale ed è specializzato in diritto commerciale e contrattuale nazionale e internazionale.
    Paolo ha iniziato la sua carriera presso Rödl & Partner, un primario studio legale tedesco, dove faceva parte del team M&A German Desk. Dopo aver lavorato con il team legale di KPMG, è entrato nello Studio Legale Avv. Massimo G. Pedrazzini SA a Lugano nel 2015, dove da allora assiste clienti svizzeri e internazionali.
    Vanta una vasta esperienza in diritto societario, fondi di investimento, operazioni di M&A nazionali e transfrontaliere, contratti commerciali, regolamentazione dei mercati finanziari, diritto immobiliare, governance aziendale e trust.
    È titolare di una laurea in giurisprudenza presso Bocconi University a Milano, nonché di un Joint Degree in diritto internazionale e degli affari dalla Freie Universität di Berlino e dall'University of Paris XII. Possiede inoltre una laurea in economia e diritto societario e due Certificates of Advanced Studies in principi giuridici delle società e in analisi giuridica delle società della Scuola universitaria professionale della Svizzera italiana.
    È membro del consiglio di amministrazione di diverse società, tra cui Caimato SA, Terzerina SA e Tifina Holding SA.
